<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="robots" content="noindex"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Restauranting</title>
<script>
// If a link got extra text glued on (e.g. /yallah-eat-kensington/If), send people to the site folder.
(function(){var p=location.pathname.split('/').filter(Boolean);if(p.length>1){location.replace('/'+p[0]+'/');}else if(p.length===1){var s=p[0].replace(/[^a-z0-9-].*$/i,'').replace(/-+$/,'');location.replace(s&&s!==p[0]?'/'+s+'/':'/');}else{location.replace('/');}})();
</script></head>
<body style="font:16px system-ui;padding:24px">Redirecting… <a href="/">Restauranting</a></body></html>
